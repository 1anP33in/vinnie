[package]
name = "vinnie"
version = "0.1.0"
description = "Vinnie - a local-first AI desktop application"
authors = ["Vinnie contributors"]
edition = "2021"
rust-version = "1.85"

[lib]
# The `_lib` suffix avoids a name collision with the binary on Windows.
name = "vinnie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-log = "=2.10.1"
tauri-plugin-clipboard-manager = "=2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
log = "0.4.34"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tokio-util = "0.7.20"
futures-util = "0.3.34"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
